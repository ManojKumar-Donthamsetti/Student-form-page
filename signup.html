<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container my-4" style="max-width: 900px;">
    <div id="alertBox"></div>
    <div class="card card-portal">
      <div class="card-header">Student Signup Form</div>
      <div class="card-body">
        <form id="signupForm" class="row g-3">
          <div class="col-md-4"><label class="form-label">Full Name</label>
            <input class="form-control" id="name" placeholder="Full Name" required></div>
          <div class="col-md-4"><label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="Email Address" required></div>
          <div class="col-md-4"><label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" minlength="6" required></div>
          <div id="common" class="row g-3 m-0 p-0"></div>
          <div class="col-md-6"><label class="form-label">Aadhaar Document Upload</label>
            <input type="file" class="form-control" id="aadhaar" accept="application/pdf" required>
            <div class="form-text">Upload PDF only</div></div>
          <div class="col-12"><button class="btn btn-primary w-100">Register</button></div>
        </form>
      </div>
    </div>
  </main>
  <div id="footer" class="footer-portal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>

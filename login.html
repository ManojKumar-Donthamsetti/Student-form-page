<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unified Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container my-5" style="max-width: 420px;">
    <div id="alertBox"></div>
    <div class="card card-portal">
      <div class="card-header">Account Login</div>
      <div class="card-body">
        <form id="loginForm">
          <div class="mb-3"><label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="Email Address" required></div>
          <div class="mb-2"><label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" required></div>
          <a href="forgot.html" class="d-block mb-3">Forgot Password?</a>
          <button class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </main>
  <div id="footer" class="footer-portal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

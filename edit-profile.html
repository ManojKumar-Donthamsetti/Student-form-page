<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container my-4" style="max-width: 900px;">
    <div id="alertBox"></div>
    <div class="banner mb-3" id="banner"></div>
    <div class="card card-portal"><div class="card-body">
      <form id="editForm" class="row g-3">
        <div class="col-md-4"><label class="form-label">Name</label>
          <input class="form-control" id="name" disabled></div>
        <div class="col-md-4"><label class="form-label">Email</label>
          <input class="form-control" id="email" disabled></div>
        <div class="col-md-4"><label class="form-label">New Password (leave blank to keep)</label>
          <input type="password" class="form-control" id="password" minlength="6"></div>
        <div id="common" class="row g-3 m-0 p-0"></div>
        <div class="col-md-6"><label class="form-label">Replace Aadhaar Document</label>
          <input type="file" class="form-control" id="aadhaar" accept="application/pdf">
          <div class="form-text">Upload PDF only. Leave empty to keep the current file.</div></div>
        <div class="col-12"><button class="btn btn-primary w-100">Update Profile</button></div>
      </form>
    </div></div>
  </main>
  <div id="footer" class="footer-portal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/edit-profile.js"></script>
</body>
</html>

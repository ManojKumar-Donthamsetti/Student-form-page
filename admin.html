<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container my-4">
    <div id="alertBox"></div>
    <div class="card card-portal mb-3">
      <div class="card-header">Admin Panel: Registered Students</div>
      <div class="card-body row g-3">
        <div class="col-md-3"><label class="form-label">Name</label>
          <input class="form-control" id="fName" placeholder="Name"></div>
        <div class="col-md-3"><label class="form-label">Class</label>
          <select class="form-select" id="fClass"><option value="">All classes</option></select></div>
        <div class="col-md-3"><label class="form-label">Age (min)</label>
          <input type="number" min="0" class="form-control" id="fMin"></div>
        <div class="col-md-3"><label class="form-label">Age (max)</label>
          <input type="number" min="0" class="form-control" id="fMax"></div>
      </div>
    </div>

    <div class="card card-portal"><div class="card-body table-responsive">
      <table class="table table-hover table-portal align-middle mb-0">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Class</th><th>Age</th><th>Aadhaar File</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div></div>
  </main>

  <!-- Edit modal: Name and Email are locked -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <form id="editForm">
        <div class="modal-header"><h5 class="modal-title">Edit Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body row g-3">
          <div class="col-md-6"><label class="form-label">Name</label>
            <input class="form-control" id="eName" disabled></div>
          <div class="col-md-6"><label class="form-label">Email</label>
            <input class="form-control" id="eEmail" disabled></div>
          <div id="common" class="row g-3 m-0 p-0"></div>
          <div class="col-md-6"><label class="form-label">Replace Aadhaar (optional)</label>
            <input type="file" class="form-control" id="aadhaar" accept="application/pdf"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div></div>
  </div>
  <div id="footer" class="footer-portal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

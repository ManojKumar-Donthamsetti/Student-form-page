<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container my-5" style="max-width: 420px;">
    <div id="alertBox"></div>
    <div class="card card-portal">
      <div class="card-header">Reset Password</div>
      <div class="card-body">
        <form id="forgotForm">
          <div class="mb-3"><label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required></div>
          <div class="mb-3"><label class="form-label">Date of Birth (to verify it's you)</label>
            <input type="date" class="form-control" id="dob" required></div>
          <div class="mb-3"><label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPass" minlength="6" required></div>
          <button class="btn btn-primary w-100">Reset Password</button>
          <a href="login.html" class="d-block text-center mt-3">Back to login</a>
        </form>
      </div>
    </div>
  </main>
  <div id="footer" class="footer-portal"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
